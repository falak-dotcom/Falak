function t(k) { return T[state.lang][k]; }
function rs(n) { return "Rs " + n.toLocaleString("en-PK"); }
function sizeLabel(s) { return s === "Free size" ? t("freeSize") : s; }
function pname(p) { return p.name[state.lang]; }
function findP(id) { return P.filter(function (p) { return p.id === id; })[0]; }
function catLabel(key) {
  if (key === "All") return t("all");
  if (state.lang === "ur") { var u = CAT_UR[String(key).toLowerCase()]; if (u) return u; }
  return key;
}
function categories() {
  var out = [];
  P.forEach(function (p) { if (out.indexOf(p.cat) === -1) out.push(p.cat); });
  return out;
}
function imgSrc(s) { return /^https?:\/\//i.test(s) ? s : encodeURI(String(s).replace(/^\/+/, "")); }

function patternCss(p) {
  var a = p.a, b = p.b;
  switch (p.pat) {
    case "floral": return "radial-gradient(circle at 25% 30%, " + b + " 0 9%, transparent 10%), radial-gradient(circle at 75% 70%, " + b + " 0 9%, transparent 10%), " + a;
    case "stripe": return "repeating-linear-gradient(90deg, " + a + " 0 14px, " + b + " 14px 20px)";
    case "dots": return "radial-gradient(" + b + " 22%, transparent 24%) 0 0 / 22px 22px, " + a;
    case "check": return "repeating-linear-gradient(0deg, " + b + "55 0 10px, transparent 10px 20px), repeating-linear-gradient(90deg, " + b + "55 0 10px, transparent 10px 20px), " + a;
    default: return "linear-gradient(160deg, " + a + ", " + b + ")";
  }
}

function addPhoto(box, p) {
  if (!p.img) return;
  var im = document.createElement("img");
  im.src = imgSrc(p.img); im.alt = pname(p); im.loading = "lazy";
  im.addEventListener("error", function () { if (im.parentNode) im.parentNode.removeChild(im); });
  box.appendChild(im);
}

/* ===== Google Sheet se products padhna ===== */
function parseCSV(text) {
  var rows = [], row = [], cur = "", q = false, i, c;
  text = text.replace(/^﻿/, "");
  for (i = 0; i < text.length; i++) {
    c = text.charAt(i);
    if (q) {
      if (c === '"') { if (text.charAt(i + 1) === '"') { cur += '"'; i++; } else { q = false; } }
      else { cur += c; }
    } else if (c === '"') { q = true; }
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text.charAt(i + 1) === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else { cur += c; }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function hueOf(s) { var h = 0, i; for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }

function productsFromCSV(text) {
  var rows = parseCSV(text);
  if (!rows.length) return [];
  var head = rows[0].map(function (h) { return String(h).toLowerCase().replace(/[^a-z]/g, ""); });
  var col = function (n) { return head.indexOf(n); };
  var ix = { name: col("name"), nameUr: col("nameurdu"), price: col("price"), old: col("oldprice"), sizes: col("sizes"),
            cat: col("category"), photo: col("photo"), det: col("details"), detUr: col("detailsurdu"), show: col("show") };
  var out = [];
  rows.slice(1).forEach(function (r, n) {
    var g = function (k) { return ix[k] >= 0 && r[ix[k]] !== undefined ? String(r[ix[k]]).trim() : ""; };
    var name = g("name"), price = parseInt(g("price").replace(/[^0-9]/g, ""), 10);
    if (!name || !price) return;
    var show = g("show").toLowerCase();
    if (["no", "n", "false", "0", "nahi", "نہیں"].indexOf(show) !== -1) return;
    var old = parseInt(g("old").replace(/[^0-9]/g, ""), 10) || 0;
    var sizes = g("sizes").split(/[,،\/|]/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!sizes.length || (sizes.length === 1 && /^free\s*size$|^free$/i.test(sizes[0]))) sizes = ["Free size"];
    var h = hueOf(name), det = g("det");
    out.push({
      id: n + 1, cat: g("cat") || "Other",
      name: { en: name, ur: g("nameUr") || name },
      fabric: { en: det, ur: g("detUr") || det },
      price: price, was: old > price ? old : 0, sizes: sizes, img: g("photo"),
      a: "hsl(" + h + ",45%,38%)", b: "hsl(" + h + ",55%,72%)", pat: "plain", tag: old > price ? "sale" : ""
    });
  });
  return out;
}

function loadProducts() {
  if (!SHEET_CSV_URL) { state.status = "ok"; return; }
  state.status = "loading"; renderGrid();
  fetch(SHEET_CSV_URL).then(function (r) {
    if (!r.ok) throw new Error("bad status");
    return r.text();
  }).then(function (txt) {
    P = productsFromCSV(txt);
    state.status = "ok";
    if (state.cat !== "All" && categories().indexOf(state.cat) === -1) state.cat = "All";
    renderChips(); renderGrid();
  }).catch(function () {
    state.status = "fail"; renderChips(); renderGrid();
  });
}

function applyStatic() {
  var d = document.documentElement;
  d.lang = state.lang; d.dir = state.lang === "ur" ? "rtl" : "ltr";
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function (el) { el.placeholder = t(el.getAttribute("data-i18n-ph")); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"), function (el) { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
  $("chips").setAttribute("aria-label", t("catsLabel"));
  $("langBtn").textContent = t("langBtn");
  $("langBtn").setAttribute("lang", state.lang === "ur" ? "en" : "ur");
  $("brand").textContent = STORE.name[state.lang];
  var dot = document.createElement("span"); dot.textContent = state.lang === "ur" ? "" : "."; $("brand").appendChild(dot);
  $("waShow").textContent = STORE.shownNumber; $("waShow").dir = "ltr";
}

function renderChips() {
  var el = $("chips"); el.innerHTML = "";
  if (state.status !== "ok") return;
  ["All"].concat(categories()).forEach(function (c) {
    var btn = document.createElement("button");
    btn.className = "chip"; btn.type = "button"; btn.textContent = catLabel(c);
    btn.setAttribute("aria-pressed", String(state.cat === c));
    btn.addEventListener("click", function () { state.cat = c; renderChips(); renderGrid(); });
    el.appendChild(btn);
  });
}

function renderGrid() {
  var g = $("grid"); g.innerHTML = "";
  if (state.status !== "ok") {
    var m = document.createElement("p"); m.className = "status";
    m.textContent = state.status === "loading" ? t("loading") : t("loadFail");
    g.appendChild(m); return;
  }
  var list = P.filter(function (p) { return state.cat === "All" || p.cat === state.cat; });
  if (!list.length) {
    var e = document.createElement("p"); e.className = "status"; e.textContent = t("noProducts"); g.appendChild(e); return;
  }
  list.forEach(function (p) {
    var card = document.createElement("article"); card.className = "card";
    var sw = document.createElement("div"); sw.className = "swatch"; sw.style.background = patternCss(p);
    addPhoto(sw, p);
    if (p.tag) { var tg = document.createElement("span"); tg.className = "tag"; tg.textContent = t("tags")[p.tag]; sw.appendChild(tg); }
    var info = document.createElement("div"); info.className = "info";
    var h = document.createElement("h3"); h.textContent = pname(p);
    var f = document.createElement("div"); f.className = "fabric"; f.textContent = p.fabric[state.lang];
    var pr = document.createElement("div"); pr.className = "price";
    pr.innerHTML = "<strong>" + rs(p.price) + "</strong>" + (p.was ? "<s>" + rs(p.was) + "</s>" : "");
    var sizes = document.createElement("div"); sizes.className = "sizes";
    if (!state.pick[p.id]) state.pick[p.id] = p.sizes.length === 1 ? p.sizes[0] : null;
    var hint = document.createElement("div"); hint.className = "hint"; hint.setAttribute("aria-live", "polite");
    p.sizes.forEach(function (s) {
      var sb = document.createElement("button"); sb.className = "size"; sb.type = "button"; sb.textContent = sizeLabel(s);
      sb.setAttribute("aria-pressed", String(state.pick[p.id] === s));
      sb.addEventListener("click", function () {
        state.pick[p.id] = s;
        Array.prototype.forEach.call(sizes.children, function (c) { c.setAttribute("aria-pressed", String(c === sb)); });
        hint.textContent = "";
      });
      sizes.appendChild(sb);
    });
    var add = document.createElement("button"); add.className = "add"; add.type = "button"; add.textContent = t("add");
    add.addEventListener("click", function () {
      if (!state.pick[p.id]) { hint.textContent = t("chooseSize"); return; }
      addToCart(p, state.pick[p.id]);
      hint.textContent = t("added");
      setTimeout(function () { hint.textContent = ""; }, 1800);
    });
    info.append(h, f, pr, sizes, hint, add);
    card.append(sw, info); g.appendChild(card);
  });
}

function addToCart(p, size) {
  var hit = state.cart.filter(function (l) { return l.id === p.id && l.size === size; })[0];
  if (hit) hit.qty += 1; else state.cart.push({ id: p.id, size: size, qty: 1 });
  renderCart();
}

function subtotal() {
  return state.cart.reduce(function (s, l) { var p = findP(l.id); return s + (p ? p.price * l.qty : 0); }, 0);
}

function orderText() {
  var lines = state.cart.map(function (l, i) {
    var p = findP(l.id);
    return (i + 1) + ". " + p.name.en + " | Size: " + l.size + " | Qty: " + l.qty + " | " + rs(p.price * l.qty);
  });
  return [
    "Assalam o Alaikum, I would like to order from " + STORE.name.en + ":", "",
    lines.join("\n"), "",
    "Subtotal: " + rs(subtotal()) + " (delivery charges to be confirmed)", "Payment: Cash on Delivery", "",
    "Name: " + $("cName").value.trim(), "Phone: " + $("cPhone").value.trim(),
    "City: " + $("cCity").value.trim(), "Address: " + $("cAddr").value.trim()
  ].join("\n");
}

function formOk() {
  return state.cart.length > 0 && ["cName", "cPhone", "cCity", "cAddr"].every(function (id) { return $(id).value.trim().length > 1; });
}

function refreshSend() {
  var btn = $("waBtn"), ok = formOk();
  btn.setAttribute("aria-disabled", String(!ok));
  btn.href = ok ? "https://wa.me/" + STORE.whatsapp + "?text=" + encodeURIComponent(orderText()) : "#";
  $("err").textContent = "";
}

function renderCart() {
  $("count").textContent = state.cart.reduce(function (s, l) { return s + l.qty; }, 0);
  var box = $("lines"); box.innerHTML = "";
  if (!state.cart.length) {
    var em = document.createElement("p"); em.className = "empty"; em.textContent = t("empty"); box.appendChild(em);
  }
  state.cart.forEach(function (l, idx) {
    var p = findP(l.id);
    var row = document.createElement("div"); row.className = "line";
    var mini = document.createElement("div"); mini.className = "mini"; mini.style.background = patternCss(p);
    addPhoto(mini, p);
    var tx = document.createElement("div"); tx.className = "t";
    var b = document.createElement("b"); b.textContent = pname(p);
    var sp = document.createElement("span"); sp.textContent = t("size") + " " + sizeLabel(l.size) + " | " + rs(p.price * l.qty);
    tx.append(b, sp);
    var q = document.createElement("div"); q.className = "qty";
    var minus = document.createElement("button"); minus.type = "button"; minus.textContent = "-"; minus.setAttribute("aria-label", "-1");
    var out = document.createElement("output"); out.textContent = l.qty;
    var plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", "+1");
    minus.addEventListener("click", function () { l.qty -= 1; if (l.qty <= 0) state.cart.splice(idx, 1); renderCart(); });
    plus.addEventListener("click", function () { l.qty += 1; renderCart(); });
    q.append(minus, out, plus);
    row.append(mini, tx, q); box.appendChild(row);
  });
  var s = subtotal();
  $("sub").textContent = rs(s); $("tot").textContent = rs(s);
  $("form").hidden = state.cart.length === 0;
  refreshSend();
}

function setLang(l) {
  state.lang = l;
  try { localStorage.setItem("falak-lang", l); } catch (e) {}
  applyStatic(); renderChips(); renderGrid(); renderCart();
}

function openCart() { $("scrim").hidden = false; $("drawer").hidden = false; $("closeCart").focus(); }
function closeCart() { $("scrim").hidden = true; $("drawer").hidden = true; $("openCart").focus(); }

$("openCart").addEventListener("click", openCart);
$("closeCart").addEventListener("click", closeCart);
$("scrim").addEventListener("click", closeCart);
$("langBtn").addEventListener("click", function () { setLang(state.lang === "en" ? "ur" : "en"); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("drawer").hidden) closeCart(); });
["cName", "cPhone", "cCity", "cAddr"].forEach(function (id) { $(id).addEventListener("input", refreshSend); });

$("waBtn").addEventListener("click", function (e) {
  if (!formOk()) { e.preventDefault(); $("err").textContent = t("errForm"); }
});
$("copyBtn").addEventListener("click", function () {
  if (!formOk()) { $("err").textContent = t("errForm"); return; }
  var note = $("copyNote");
  var done = function () { note.textContent = t("copied") + STORE.shownNumber; };
  var fail = function () { note.textContent = t("copyFail"); };
  try { navigator.clipboard.writeText(orderText()).then(done, fail); } catch (e) { fail(); }
});

var saved = null;
try { saved = localStorage.getItem("falak-lang"); } catch (e) {}
setLang(saved === "ur" ? "ur" : "en");
loadProducts();
</script>
</body>
</html>
